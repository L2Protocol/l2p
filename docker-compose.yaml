services:
  init:
    image: alpine
    command:
      - /bin/sh
      - -c
      - |
        chown -R 1000:1000 /data

        echo "done grany data directory permission"
    volumes:
      - data:/data

  l2p:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NETWORK=mainnet
    restart: unless-stopped
    ports:
      - 31398:31398
      - 31398:31398/udp
      - 8545:8545
      - 8546:8546
    healthcheck:
      test: |
        netstat -tunlp | grep 8545 > /dev/null; if [ 0 != $$? ]; then exit 1; else exit 0; fi;

      interval: 5s
      retries: 5
      start_period: 10s
      timeout: 3s
    volumes:
      - data:/data
      - config:/l2p/config

volumes:
  config:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/tmp/l2p/config/mainnet'
  data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/tmp/l2p/data/mainnet'
